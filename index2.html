<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wilson Abreu | Artista Visual</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
            background: #1c1c1c;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            color: #ccc;
        }

        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 25px;
        }

        section {
            padding: 40px 20px;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .obra {
            width: 280px;
            padding: 20px;
            background: #1c1c1c;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Wilson Abreu</h1>
        <h2>Artista Visual Dominicano</h2>

        <p>
            Pintura, dibujo y expresión artística.
        </p>

        <a href="#galeria" class="boton">Ver galería</a>
    </header>

    <section>
        <h2>Sobre el artista</h2>

        <p>
            Wilson Abreu es un artista visual dominicano
            dedicado a la pintura y el dibujo.
        </p>
    </section>

    <section id="galeria">
        <h2>Galería</h2>

        <div class="galeria">

            <div class="obra">
                <h3>Obra 1</h3>
                <p>Próximamente</p>
            </div>

            <div class="obra">
                <h3>Obra 2</h3>
                <p>Próximamente</p>
            </div>

            <div class="obra">
                <h3>Obra 3</h3>
                <p>Próximamente</p>
            </div>

        </div>
    </section>

</body>
</html>
